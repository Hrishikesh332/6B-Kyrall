[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "6b-backend"
version = "0.2.0"
description = "Local engineering workspace with durable agent runs and verified CAD artifacts"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "waitress>=3,<4", "pydantic>=2.10,<3", "httpx>=0.27,<1", "python-dotenv>=1,<2", "cadquery>=2.5,<3", "trimesh>=4.5,<6", "pypdf>=6,<7", "matplotlib>=3.9,<4", "Pillow>=11,<13", "claude-agent-sdk>=0.2.170,<0.3", "firebase-admin>=7.7,<8"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
